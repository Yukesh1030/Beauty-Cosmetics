  <style>
    /* ==========================================================================
       STACKLY SKINCARE — AUTH SCREENS (Theme Color Palette System)
       Palette:
         - Nude / Blush Background: #EEDFDA & #F7EFEA
         - Deep Midnight Navy:      #06121A
         - Radiant Crimson / Coral: #F81D43 (Hover: #D91033)
         - Soft Cream / White:      #FFFFFF
         - Warm Slate / Muted:      #5C5552 & #8A827E
         - Warm Border Subtle:      #E6D9D2
       ========================================================================== */
    :root {
      --color-bg-nude: #EEDFDA;
      --color-bg-nude-light: #F7EFEA;
      --color-midnight: #06121A;
      --color-midnight-light: #0D1E2A;
      --color-coral: #F81D43;
      --color-coral-hover: #D91033;
      --color-coral-glow: rgba(248, 29, 67, 0.35);
      --color-coral-subtle: rgba(248, 29, 67, 0.12);
      --color-text-dark: #1A1817;
      --color-text-muted: #5C5552;
      --color-text-light: #F5EFEB;
      --color-white: #FFFFFF;
      --color-border-subtle: #E6D9D2;
      --color-border-card: rgba(223, 208, 201, 0.85);

      --font-serif: 'Playfair Display', Georgia, serif;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      font-family: var(--font-sans);
      min-height: 100vh;
      width: 100%;
      background-color: var(--color-bg-nude);
      color: var(--color-text-dark);
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Warm Glow & Angled Composition */
    .auth-bg-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      background: linear-gradient(135deg, #FBF6F3 0%, #EEDFDA 100%);
    }

    .auth-bg-shape {
      position: absolute;
      top: 0;
      left: 0;
      width: 65%;
      height: 100%;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.82) 0%, rgba(247, 239, 234, 0.72) 100%);
      clip-path: polygon(0 0, 100% 0, 82% 100%, 0% 100%);
      opacity: 0.95;
    }

    .auth-glow-bottom {
      position: absolute;
      bottom: -120px;
      left: -100px;
      width: 480px;
      height: 480px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(248, 29, 67, 0.16) 0%, rgba(248, 29, 67, 0) 70%);
      filter: blur(48px);
      animation: floatBadge 6s ease-in-out infinite alternate;
    }

    .auth-glow-top {
      position: absolute;
      top: -100px;
      right: -80px;
      width: 460px;
      height: 460px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(248, 29, 67, 0.12) 0%, rgba(248, 29, 67, 0) 70%);
      filter: blur(44px);
    }

    @keyframes floatBadge {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-12px) scale(1.05); }
    }

    /* Top Bar Navigation (Back to Home & Logo) */
    .auth-top-bar {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 1360px;
      margin: 0 auto;
      padding: 24px 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .btn-back-home {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--color-midnight);
      text-decoration: none;
      padding: 10px 22px;
      background: rgba(255, 255, 255, 0.85);
      border: 1.5px solid rgba(223, 208, 201, 0.9);
      border-radius: 999px;
      box-shadow: 0 4px 14px rgba(6, 18, 26, 0.04);
      transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .btn-back-home i {
      font-size: 0.88rem;
      transition: transform 0.2s ease;
    }

    .btn-back-home:hover {
      color: var(--color-coral);
      border-color: var(--color-coral);
      background: #FFFFFF;
      transform: translateX(-3px);
      box-shadow: 0 6px 18px rgba(248, 29, 67, 0.15);
    }

    .btn-back-home:hover i {
      transform: translateX(-3px);
    }

    .auth-brand-logo {
      height: 38px;
      width: auto;
      object-fit: contain;
      display: block;
    }

    /* Main Container */
    .auth-main-container {
      position: relative;
      z-index: 5;
      min-height: calc(100vh - 90px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 24px 48px;
    }

    /* Signup Card with Luxury Frosted Styling */
    .auth-card {
      width: 100%;
      max-width: 450px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 28px;
      padding: 40px 38px;
      box-shadow: 0 24px 64px rgba(6, 18, 26, 0.08), 0 4px 20px rgba(248, 29, 67, 0.04);
      border: 1.5px solid rgba(255, 255, 255, 0.95);
      position: relative;
    }

    /* Subtle Card Top Badge */
    .auth-card-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--color-coral-subtle);
      color: var(--color-coral);
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .auth-card-badge .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--color-coral);
    }

    .auth-card-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .auth-card-title {
      font-family: var(--font-serif);
      font-size: 2rem;
      font-weight: 700;
      color: var(--color-midnight);
      letter-spacing: -0.01em;
      margin-bottom: 8px;
      line-height: 1.2;
    }

    .auth-card-subtitle {
      font-size: 0.94rem;
      color: var(--color-text-muted);
      font-weight: 400;
    }

    /* Form Fields */
    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .auth-field-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .auth-label {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--color-midnight);
      letter-spacing: -0.01em;
    }

    /* Input Wrap with Warm Palette */
    .auth-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .auth-input-icon {
      position: absolute;
      left: 16px;
      font-size: 0.95rem;
      color: #8A827E;
      pointer-events: none;
      transition: color 0.2s ease;
    }

    .auth-input,
    .auth-select {
      width: 100%;
      height: 48px;
      padding: 0 16px 0 46px;
      background-color: #FAF6F3;
      border: 1.5px solid var(--color-border-subtle);
      border-radius: 14px;
      font-family: inherit;
      font-size: 0.94rem;
      color: var(--color-midnight);
      transition: all 0.22s ease;
      outline: none;
    }

    .auth-input::placeholder {
      color: #A09690;
      font-weight: 400;
    }

    .auth-input:focus,
    .auth-select:focus {
      background-color: #FFFFFF;
      border-color: var(--color-coral);
      box-shadow: 0 0 0 3.5px rgba(248, 29, 67, 0.15);
    }

    .auth-input:focus + .auth-input-icon,
    .auth-input-wrap:focus-within .auth-input-icon {
      color: var(--color-coral);
    }

    .auth-select {
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
      font-weight: 600;
    }

    .auth-select-arrow {
      position: absolute;
      right: 16px;
      font-size: 0.85rem;
      color: #8A827E;
      pointer-events: none;
    }

    .auth-password-toggle {
      position: absolute;
      right: 14px;
      background: none;
      border: none;
      color: #8A827E;
      font-size: 1rem;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s ease;
    }

    .auth-password-toggle:hover {
      color: var(--color-coral);
    }

    /* Submit Button (Signature Radiant Coral) */
    .btn-auth-submit {
      width: 100%;
      height: 50px;
      background-color: var(--color-coral);
      color: #FFFFFF;
      border: 1.5px solid var(--color-coral);
      border-radius: 999px;
      font-family: inherit;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.22s ease, background-color 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
      margin-top: 6px;
      box-shadow: 0 8px 24px rgba(248, 29, 67, 0.32);
    }

    .btn-auth-submit:hover {
      background-color: var(--color-coral-hover);
      border-color: var(--color-coral-hover);
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(248, 29, 67, 0.45);
    }

    .btn-auth-submit:active {
      transform: translateY(0);
    }

    .btn-auth-submit:disabled {
      opacity: 0.75;
      cursor: not-allowed;
      transform: none;
    }

    /* Footer Switch Link */
    .auth-card-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.9rem;
      color: var(--color-text-muted);
    }

    .auth-switch-link {
      color: var(--color-midnight);
      font-weight: 800;
      text-decoration: none;
      transition: color 0.2s ease;
      margin-left: 4px;
    }

    .auth-switch-link:hover {
      color: var(--color-coral);
      text-decoration: underline;
    }

    /* Toast Notification */
    .auth-toast {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background-color: var(--color-midnight);
      color: #FFFFFF;
      border: 1.5px solid rgba(248, 29, 67, 0.3);
      padding: 14px 26px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 16px 36px rgba(6, 18, 26, 0.35);
      z-index: 1000;
      opacity: 0;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
    }

    .auth-toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .auth-toast.toast-error {
      border-color: #F81D43;
    }

    .auth-toast.toast-error #toast-icon {
      color: #F81D43;
    }

    .auth-toast.toast-success {
      border-color: #38BDF8;
    }

    .auth-toast.toast-success #toast-icon {
      color: #34D399;
    }

    /* Mobile Responsiveness */
    @media (max-width: 640px) {
      .auth-top-bar {
        padding: 18px 20px;
      }

      .btn-back-home {
        padding: 8px 16px;
        font-size: 0.85rem;
      }

      .auth-card {
        padding: 34px 22px;
        border-radius: 22px;
      }

      .auth-card-title {
        font-size: 1.7rem;
      }

      .auth-bg-shape {
        width: 100%;
        clip-path: polygon(0 0, 100% 0, 100% 45%, 0% 60%);
      }
    }

<style id="stackly-preloader-css">
.stackly-preloader{position:fixed;inset:0;width:100vw;height:100vh;background-color:#06121A;z-index:999999;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity .4s cubic-bezier(.4,0,.2,1),visibility .4s ease;overflow:hidden}
.stackly-preloader.preloader-hidden{opacity:0;visibility:hidden;pointer-events:none}
.preloader-content{display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;z-index:2}
.preloader-icon-wrap{position:relative;width:86px;height:86px;display:flex;align-items:center;justify-content:center;margin-bottom:20px}
.preloader-logo-icon{width:52px;height:52px;object-fit:contain;filter:drop-shadow(0 0 16px rgba(248,29,67,.5));animation:preloaderPulse 1.2s ease-in-out infinite alternate}
.preloader-ring{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,255,255,.08);border-top-color:#F81D43;border-right-color:rgba(229,184,105,.7);animation:preloaderSpin .9s linear infinite}
.preloader-brand-title{font-family:'DM Sans','Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:800;letter-spacing:4px;color:#FFFFFF;margin-bottom:18px;text-transform:uppercase;opacity:.95}
.preloader-bar-wrap{width:140px;height:3px;background:rgba(255,255,255,.1);border-radius:999px;overflow:hidden;position:relative}
.preloader-bar{position:absolute;top:0;left:0;height:100%;width:0%;background:linear-gradient(90deg,#F81D43,#E5B869);border-radius:999px;animation:preloaderProgress 1s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes preloaderPulse{0%{transform:scale(.95);filter:drop-shadow(0 0 10px rgba(248,29,67,.4))}100%{transform:scale(1.05);filter:drop-shadow(0 0 22px rgba(248,29,67,.85))}}
@keyframes preloaderSpin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes preloaderProgress{0%{width:0%}100%{width:100%}}
</style>
<div class="stackly-preloader" id="stackly-preloader" aria-label="Loading Stackly Skincare">
  <div class="preloader-content">
    <div class="preloader-icon-wrap">
      <img src="assets/Favicon.png" alt="Stackly Icon" class="preloader-logo-icon">
      <div class="preloader-ring"></div>
    </div>
    <div class="preloader-brand-title">STACKLY</div>
    <div class="preloader-bar-wrap">
      <div class="preloader-bar"></div>
    </div>
  </div>
</div>
<script>
  (function() {
    var start = Date.now();
    function dismiss() {
      var wait = Math.max(0, 1000 - (Date.now() - start));
      setTimeout(function() {
        var p = document.getElementById('stackly-preloader');
        if (p) {
          p.classList.add('preloader-hidden');
          setTimeout(function() {
            if (p && p.parentNode) p.parentNode.removeChild(p);
          }, 450);
        }
      }, wait);
    }
    if (document.readyState === 'complete') {
      dismiss();
    } else {
      window.addEventListener('load', dismiss);
      setTimeout(dismiss, 1000); // 1-second fallback
    }
  })();
</script>

  <!-- GSAP Animation Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      'use strict';

      // 1. GSAP Entrance Animation
      if (typeof gsap !== 'undefined') {
        const tl = gsap.timeline({ defaults: { ease: 'power3.out' } });

        tl.from('#btn-back-home', {
          opacity: 0,
          x: -20,
          duration: 0.6,
          delay: 0.1
        })
        .from('#auth-logo', {
          opacity: 0,
          x: 20,
          duration: 0.6
        }, '-=0.5')
        .from('#signup-card', {
          opacity: 0,
          scale: 0.94,
          y: 25,
          duration: 0.75
        }, '-=0.4')
        .from('.auth-field-group, #btn-submit, .auth-card-footer', {
          opacity: 0,
          y: 14,
          duration: 0.5,
          stagger: 0.08
        }, '-=0.3');
      }

      // 2. Toggle Password Visibility
      const togglePasswordBtn = document.getElementById('toggle-password');
      const passwordInput = document.getElementById('signup-password');
      const eyeIcon = document.getElementById('eye-icon');

      if (togglePasswordBtn && passwordInput && eyeIcon) {
        togglePasswordBtn.addEventListener('click', () => {
          const isPassword = passwordInput.type === 'password';
          passwordInput.type = isPassword ? 'text' : 'password';
          eyeIcon.classList.toggle('fa-eye', !isPassword);
          eyeIcon.classList.toggle('fa-eye-slash', isPassword);
        });
      }

      // 3. Toast Helper Function
      const toast = document.getElementById('auth-toast');
      const toastMessage = document.getElementById('toast-message');
      const toastIcon = document.getElementById('toast-icon');

      function showToast(message, type = 'info') {
        if (!toast) return;
        toastMessage.textContent = message;
        toast.className = 'auth-toast';
        toast.classList.add(type === 'error' ? 'toast-error' : 'toast-success', 'show');

        toastIcon.className = type === 'error' 
          ? 'fa-solid fa-circle-exclamation' 
          : 'fa-solid fa-circle-check';

        setTimeout(() => {
          toast.classList.remove('show');
        }, 2600);
      }

      // 4. Form Validation & Redirection to Login Page
      const signupForm = document.getElementById('signup-form');
      const roleSelect = document.getElementById('signup-role');
      const nameInput = document.getElementById('signup-name');
      const emailInput = document.getElementById('signup-email');
      const submitBtn = document.getElementById('btn-submit');

      if (signupForm) {
        signupForm.addEventListener('submit', (e) => {
          e.preventDefault();

          const role = roleSelect.value;
          const name = nameInput.value.trim();
          const email = emailInput.value.trim();
          const password = passwordInput.value;

          // Strict Validation
          if (!name || name.length < 2) {
            showToast('Please enter your full name.', 'error');
            nameInput.focus();
            return;
          }

          if (!email) {
            showToast('Please enter your email address.', 'error');
            emailInput.focus();
            return;
          }

          const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          if (!emailRegex.test(email)) {
            showToast('Please enter a valid email address.', 'error');
            emailInput.focus();
            return;
          }

          if (!password || password.length < 6) {
            showToast('Password must be at least 6 characters long.', 'error');
            passwordInput.focus();
            return;
          }

          // Register in localStorage demo database
          localStorage.setItem('stackly_registered_user', JSON.stringify({
            name: name,
            email: email,
            role: role,
            createdAt: new Date().toISOString()
          }));

          // Visual loading state
          submitBtn.disabled = true;
          submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> <span>Creating account...</span>';

          showToast('Account created successfully! Redirecting to login...', 'success');

          // Redirect to Login.html after field validation
          setTimeout(() => {
            window.location.href = 'Login.html';
          }, 1100);
        });
      }

      // Brand logo directs to top AdminDashboard/ClientDashboard with respect to role
      const authLogoLink = document.querySelector('.auth-header a[aria-label="Stackly Skincare Home"]');
      if (authLogoLink) {
        authLogoLink.addEventListener('click', (e) => {
          try {
            const raw = localStorage.getItem('stackly_auth_user') || sessionStorage.getItem('stackly_auth_user');
            if (raw) {
              const auth = JSON.parse(raw);
              if (auth && auth.role === 'Admin') {
                e.preventDefault();
                window.location.href = 'AdminDashboard.html';
              } else if (auth && (auth.role === 'Client' || auth.role === 'Customer')) {
                e.preventDefault();
                window.location.href = 'ClientDashboard.html';
              }
            }
          } catch(err) {}
        });
      }
    });
  </script>

</body>
