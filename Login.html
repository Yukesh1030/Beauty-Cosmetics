<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to your Stackly Skincare account. Access client rituals, order status, or administrative dashboard.">
  <meta name="theme-color" content="#06121A">

  <title>Login | Stackly Skincare Studio</title>

  <!-- Favicon -->
  <link rel="icon" type="image/webp" href="assets/Brand-logo.webp">

  <!-- Google Fonts: Playfair Display & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- FontAwesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous">

  <style>
    /* ==========================================================================
       STACKLY SKINCARE — AUTH SCREENS (Theme Color Palette System)
       Palette:
         - Nude / Blush Background: #EEDFDA & #F7EFEA
         - Deep Midnight Navy:      #06121A
         - Radiant Crimson / Coral: #F81D43 (Hover: #D91033)
         - Soft Cream / White:      #FFFFFF
         - Warm Slate / Muted:      #5C5552 & #8A827E
         - Warm Border Subtle:      #E6D9D2
       ========================================================================== */
    :root {
      --color-bg-nude: #EEDFDA;
      --color-bg-nude-light: #F7EFEA;
      --color-midnight: #06121A;
      --color-midnight-light: #0D1E2A;
      --color-coral: #F81D43;
      --color-coral-hover: #D91033;
      --color-coral-glow: rgba(248, 29, 67, 0.35);
      --color-coral-subtle: rgba(248, 29, 67, 0.12);
      --color-text-dark: #1A1817;
      --color-text-muted: #5C5552;
      --color-text-light: #F5EFEB;
      --color-white: #FFFFFF;
      --color-border-subtle: #E6D9D2;
      --color-border-card: rgba(223, 208, 201, 0.85);

      --font-serif: 'Playfair Display', Georgia, serif;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      font-family: var(--font-sans);
      min-height: 100vh;
      width: 100%;
      background-color: var(--color-bg-nude);
      color: var(--color-text-dark);
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Warm Glow & Angled Composition (Matching Storefront Theme) */
    .auth-bg-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      background: linear-gradient(135deg, #FBF6F3 0%, #EEDFDA 100%);
    }

    /* Angled geometric split background in soft luxury cream tone */
    .auth-bg-shape {
      position: absolute;
      top: 0;
      left: 0;
      width: 65%;
      height: 100%;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.82) 0%, rgba(247, 239, 234, 0.72) 100%);
      clip-path: polygon(0 0, 100% 0, 82% 100%, 0% 100%);
      opacity: 0.95;
    }

    /* Radiant Coral Ambient Orbs */
    .auth-glow-bottom {
      position: absolute;
      bottom: -120px;
      left: -100px;
      width: 480px;
      height: 480px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(248, 29, 67, 0.16) 0%, rgba(248, 29, 67, 0) 70%);
      filter: blur(48px);
      animation: floatBadge 6s ease-in-out infinite alternate;
    }

    .auth-glow-top {
      position: absolute;
      top: -100px;
      right: -80px;
      width: 460px;
      height: 460px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(248, 29, 67, 0.12) 0%, rgba(248, 29, 67, 0) 70%);
      filter: blur(44px);
    }

    @keyframes floatBadge {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-12px) scale(1.05); }
    }

    /* Top Bar Navigation (Back to Home & Logo) */
    .auth-top-bar {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 1360px;
      margin: 0 auto;
      padding: 24px 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .btn-back-home {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--color-midnight);
      text-decoration: none;
      padding: 10px 22px;
      background: rgba(255, 255, 255, 0.85);
      border: 1.5px solid rgba(223, 208, 201, 0.9);
      border-radius: 999px;
      box-shadow: 0 4px 14px rgba(6, 18, 26, 0.04);
      transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .btn-back-home i {
      font-size: 0.88rem;
      transition: transform 0.2s ease;
    }

    .btn-back-home:hover {
      color: var(--color-coral);
      border-color: var(--color-coral);
      background: #FFFFFF;
      transform: translateX(-3px);
      box-shadow: 0 6px 18px rgba(248, 29, 67, 0.15);
    }

    .btn-back-home:hover i {
      transform: translateX(-3px);
    }

    .auth-brand-logo {
      height: 38px;
      width: auto;
      object-fit: contain;
      display: block;
    }

    /* Main Auth Container */
    .auth-main-container {
      position: relative;
      z-index: 5;
      min-height: calc(100vh - 90px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 24px 48px;
    }

    /* Auth Card with Luxury Frosted Border & Palette */
    .auth-card {
      width: 100%;
      max-width: 450px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 28px;
      padding: 42px 38px;
      box-shadow: 0 24px 64px rgba(6, 18, 26, 0.08), 0 4px 20px rgba(248, 29, 67, 0.04);
      border: 1.5px solid rgba(255, 255, 255, 0.95);
      position: relative;
    }

    /* Subtle Card Top Badge */
    .auth-card-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--color-coral-subtle);
      color: var(--color-coral);
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .auth-card-badge .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--color-coral);
    }

    /* Card Header */
    .auth-card-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .auth-card-title {
      font-family: var(--font-serif);
      font-size: 2rem;
      font-weight: 700;
      color: var(--color-midnight);
      letter-spacing: -0.01em;
      margin-bottom: 8px;
      line-height: 1.2;
    }

    .auth-card-subtitle {
      font-size: 0.94rem;
      color: var(--color-text-muted);
      font-weight: 400;
    }

    /* Form Fields */
    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .auth-field-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .auth-label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .auth-label {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--color-midnight);
      letter-spacing: -0.01em;
    }

    .auth-forgot-link {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--color-coral);
      text-decoration: none;
      transition: color 0.2s ease, text-decoration 0.2s ease;
    }

    .auth-forgot-link:hover {
      color: var(--color-coral-hover);
      text-decoration: underline;
    }

    /* Input Container with Warm Theme Styling */
    .auth-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .auth-input-icon {
      position: absolute;
      left: 16px;
      font-size: 0.95rem;
      color: #8A827E;
      pointer-events: none;
      transition: color 0.2s ease;
    }

    .auth-input,
    .auth-select {
      width: 100%;
      height: 48px;
      padding: 0 16px 0 46px;
      background-color: #FAF6F3;
      border: 1.5px solid var(--color-border-subtle);
      border-radius: 14px;
      font-family: inherit;
      font-size: 0.94rem;
      color: var(--color-midnight);
      transition: all 0.22s ease;
      outline: none;
    }

    .auth-input::placeholder {
      color: #A09690;
      font-weight: 400;
    }

    .auth-input:focus,
    .auth-select:focus {
      background-color: #FFFFFF;
      border-color: var(--color-coral);
      box-shadow: 0 0 0 3.5px rgba(248, 29, 67, 0.15);
    }

    .auth-input:focus + .auth-input-icon,
    .auth-input-wrap:focus-within .auth-input-icon {
      color: var(--color-coral);
    }

    /* Custom Select Styling */
    .auth-select {
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
      font-weight: 600;
    }

    .auth-select-arrow {
      position: absolute;
      right: 16px;
      font-size: 0.85rem;
      color: #8A827E;
      pointer-events: none;
    }

    /* Password Eye Toggle */
    .auth-password-toggle {
      position: absolute;
      right: 14px;
      background: none;
      border: none;
      color: #8A827E;
      font-size: 1rem;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s ease;
    }

    .auth-password-toggle:hover {
      color: var(--color-coral);
    }

    /* Submit Button (Radiant Coral Signature Button) */
    .btn-auth-submit {
      width: 100%;
      height: 50px;
      background-color: var(--color-coral);
      color: #FFFFFF;
      border: 1.5px solid var(--color-coral);
      border-radius: 999px;
      font-family: inherit;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.22s ease, background-color 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
      margin-top: 6px;
      box-shadow: 0 8px 24px rgba(248, 29, 67, 0.32);
    }

    .btn-auth-submit:hover {
      background-color: var(--color-coral-hover);
      border-color: var(--color-coral-hover);
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(248, 29, 67, 0.45);
    }

    .btn-auth-submit:active {
      transform: translateY(0);
    }

    .btn-auth-submit:disabled {
      opacity: 0.75;
      cursor: not-allowed;
      transform: none;
    }

    /* Card Footer Switch Link */
    .auth-card-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.9rem;
      color: var(--color-text-muted);
    }

    .auth-switch-link {
      color: var(--color-midnight);
      font-weight: 800;
      text-decoration: none;
      transition: color 0.2s ease;
      margin-left: 4px;
      position: relative;
    }

    .auth-switch-link:hover {
      color: var(--color-coral);
      text-decoration: underline;
    }

    /* Toast Notification (Deep Midnight with Coral accent) */
    .auth-toast {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background-color: var(--color-midnight);
      color: #FFFFFF;
      border: 1.5px solid rgba(248, 29, 67, 0.3);
      padding: 14px 26px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 16px 36px rgba(6, 18, 26, 0.35);
      z-index: 1000;
      opacity: 0;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
    }

    .auth-toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .auth-toast.toast-error {
      border-color: #F81D43;
    }

    .auth-toast.toast-error #toast-icon {
      color: #F81D43;
    }

    .auth-toast.toast-success {
      border-color: #38BDF8;
    }

    .auth-toast.toast-success #toast-icon {
      color: #34D399;
    }

    /* Mobile Responsiveness */
    @media (max-width: 640px) {
      .auth-top-bar {
        padding: 18px 20px;
      }

      .btn-back-home {
        padding: 8px 16px;
        font-size: 0.85rem;
      }

      .auth-card {
        padding: 34px 22px;
        border-radius: 22px;
      }

      .auth-card-title {
        font-size: 1.7rem;
      }

      .auth-bg-shape {
        width: 100%;
        clip-path: polygon(0 0, 100% 0, 100% 45%, 0% 60%);
      }
    }
  </style>
</head>
<body>

  <!-- Ambient Decorative Background -->
  <div class="auth-bg-layer" aria-hidden="true">
    <div class="auth-bg-shape"></div>
    <div class="auth-glow-bottom"></div>
    <div class="auth-glow-top"></div>
  </div>

  <!-- Top Bar: Back to Home & Stackly Logo -->
  <header class="auth-top-bar">
    <a href="index.html" class="btn-back-home" id="btn-back-home">
      <i class="fa-solid fa-arrow-left"></i>
      <span>Back to Home</span>
    </a>

    <a href="index.html" aria-label="Stackly Skincare Home">
      <img src="assets/Brand-logo.webp" alt="Stackly Skincare Logo" class="auth-brand-logo" id="auth-logo">
    </a>
  </header>

  <!-- Main Login Card Area -->
  <main class="auth-main-container">
    <div class="auth-card" id="login-card">
      
      <!-- Card Title & Subtitle with Luxury Badge -->
      <div class="auth-card-header">
        <div class="auth-card-badge">
          <span class="badge-dot"></span>
          <span>Stackly Sanctuary</span>
        </div>
        <h1 class="auth-card-title">Welcome Back</h1>
        <p class="auth-card-subtitle">Sign in to your client or admin account</p>
      </div>

      <!-- Login Form -->
      <form id="login-form" class="auth-form" novalidate>
        
        <!-- Login As Dropdown -->
        <div class="auth-field-group">
          <label for="login-role" class="auth-label">Login As</label>
          <div class="auth-input-wrap">
            <i class="fa-solid fa-user auth-input-icon"></i>
            <select id="login-role" class="auth-select" required>
              <option value="Client" selected>Client</option>
              <option value="Admin">Admin</option>
            </select>
            <i class="fa-solid fa-chevron-down auth-select-arrow"></i>
          </div>
        </div>

        <!-- Email Address -->
        <div class="auth-field-group">
          <label for="login-email" class="auth-label">Email Address</label>
          <div class="auth-input-wrap">
            <i class="fa-regular fa-envelope auth-input-icon"></i>
            <input type="email" id="login-email" class="auth-input" placeholder="user@example.com" required autocomplete="email">
          </div>
        </div>

        <!-- Password with Forgot Password link on right -->
        <div class="auth-field-group">
          <div class="auth-label-row">
            <label for="login-password" class="auth-label">Password</label>
            <a href="404.html" class="auth-forgot-link">Forgot password?</a>
          </div>
          <div class="auth-input-wrap">
            <i class="fa-solid fa-lock auth-input-icon"></i>
            <input type="password" id="login-password" class="auth-input" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" class="auth-password-toggle" id="toggle-password" aria-label="Toggle password visibility">
              <i class="fa-regular fa-eye" id="eye-icon"></i>
            </button>
          </div>
        </div>

        <!-- Login Button -->
        <button type="submit" class="btn-auth-submit" id="btn-submit">
          <span>Login</span>
        </button>

      </form>

      <!-- Bottom Switch Link -->
      <div class="auth-card-footer">
        <span>Don't have an account?</span>
        <a href="Signup.html" class="auth-switch-link">Create an account</a>
      </div>

    </div>
  </main>

  <!-- Toast Notification Feedback -->
  <div id="auth-toast" class="auth-toast" role="alert" aria-live="polite">
    <i class="fa-solid fa-circle-info" id="toast-icon"></i>
    <span id="toast-message">Notification message</span>
  </div>

  <!-- GSAP Animation Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      'use strict';

      // 1. GSAP Entrance Animation
      if (typeof gsap !== 'undefined') {
        const tl = gsap.timeline({ defaults: { ease: 'power3.out' } });

        tl.from('#btn-back-home', {
          opacity: 0,
          x: -20,
          duration: 0.6,
          delay: 0.1
        })
        .from('#auth-logo', {
          opacity: 0,
          x: 20,
          duration: 0.6
        }, '-=0.5')
        .from('#login-card', {
          opacity: 0,
          scale: 0.94,
          y: 25,
          duration: 0.75
        }, '-=0.4')
        .from('.auth-field-group, #btn-submit, .auth-card-footer', {
          opacity: 0,
          y: 14,
          duration: 0.5,
          stagger: 0.08
        }, '-=0.3');
      }

      // 2. Toggle Password Visibility
      const togglePasswordBtn = document.getElementById('toggle-password');
      const passwordInput = document.getElementById('login-password');
      const eyeIcon = document.getElementById('eye-icon');

      if (togglePasswordBtn && passwordInput && eyeIcon) {
        togglePasswordBtn.addEventListener('click', () => {
          const isPassword = passwordInput.type === 'password';
          passwordInput.type = isPassword ? 'text' : 'password';
          eyeIcon.classList.toggle('fa-eye', !isPassword);
          eyeIcon.classList.toggle('fa-eye-slash', isPassword);
        });
      }

      // 3. Toast Helper Function
      const toast = document.getElementById('auth-toast');
      const toastMessage = document.getElementById('toast-message');
      const toastIcon = document.getElementById('toast-icon');

      function showToast(message, type = 'info') {
        if (!toast) return;
        toastMessage.textContent = message;
        toast.className = 'auth-toast';
        toast.classList.add(type === 'error' ? 'toast-error' : 'toast-success', 'show');

        toastIcon.className = type === 'error' 
          ? 'fa-solid fa-circle-exclamation' 
          : 'fa-solid fa-circle-check';

        setTimeout(() => {
          toast.classList.remove('show');
        }, 2600);
      }

      // 4. Form Validation & Redirection Logic
      const loginForm = document.getElementById('login-form');
      const roleSelect = document.getElementById('login-role');
      const emailInput = document.getElementById('login-email');
      const submitBtn = document.getElementById('btn-submit');

      if (loginForm) {
        loginForm.addEventListener('submit', (e) => {
          e.preventDefault();

          const role = roleSelect.value;
          const email = emailInput.value.trim();
          const password = passwordInput.value;

          // Simple Validation
          if (!email) {
            showToast('Please enter your email address.', 'error');
            emailInput.focus();
            return;
          }

          const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          if (!emailRegex.test(email)) {
            showToast('Please enter a valid email format.', 'error');
            emailInput.focus();
            return;
          }

          if (!password || password.length < 3) {
            showToast('Please enter your password.', 'error');
            passwordInput.focus();
            return;
          }

          // Save user credentials into session for Dashboard personalization
          const userName = role === 'Admin' ? 'Admin Yukesh' : email.split('@')[0].replace('.', ' ');
          localStorage.setItem('stackly_auth_user', JSON.stringify({
            name: userName,
            email: email,
            role: role,
            loginTime: new Date().toISOString()
          }));

          // Visual loading state
          submitBtn.disabled = true;
          submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> <span>Authenticating...</span>';

          showToast(`Welcome back, ${userName}! Opening ${role} Dashboard...`, 'success');

          // Redirection based on selected role
          setTimeout(() => {
            if (role === 'Admin') {
              window.location.href = 'AdminDashboard.html';
            } else {
              window.location.href = 'ClientDashboard.html';
            }
          }, 900);
        });
      }
    });
  </script>

</body>
</html>
